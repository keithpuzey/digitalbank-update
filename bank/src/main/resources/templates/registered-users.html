<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/sections :: header-css}"/>
<body>

<aside th:replace="~{common/menus :: left-panel}"></aside>

<div id="right-panel" class="right-panel">

    <header th:replace="~{common/menus :: rp-header}"/>
    <div th:replace="~{common/menus :: rp-breadcrumbs (pageTitle='Registered Users')}"/>

    <div class="content mt-3">
        <div class="animated fadeIn">
            <div class="card report-card">
                <div class="card-header theme-card-header text-white">
                    <strong class="header-title">Registered Users</strong>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <form id="queryForm" onsubmit="fetchData(event)">
                                <button class="btn btn-primary btn-sm btn-theme">Refresh Report</button>
                            </form>
                        </div>
                        <div class="col-md-6">
                            <input type="text" id="tableSearch" class="form-control form-control-sm search-input" 
                                   placeholder="Search users..." onkeyup="filterTable()">
                        </div>
                    </div>
                    <hr />
                    <div id="results" class="ajax-table-container"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<div th:replace="~{common/sections :: footer-scripts}"></div>

<style>
    /* Card & Header Styling */
    .report-card {
        background: #ffffff !important;
        border: 1px solid #c0c0c0 !important;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2) !important;
        border-radius: 12px !important;
    }

    .theme-card-header {
        background-color: #002244 !important;
        border-bottom: 2px solid #00aaff !important;
        padding: 15px 20px !important;
    }

    .header-title {
        color: #ffffff !important;
        font-size: 1.1rem !important;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Search Input Styling */
    .search-input {
        border: 2px solid #ced4da !important;
        border-radius: 6px !important;
        color: #000 !important;
        font-weight: 600 !important;
    }
    
    .search-input:focus {
        border-color: #00aaff !important;
        box-shadow: 0 0 5px rgba(0,170,255,0.5) !important;
    }

    .btn-theme {
        background-color: #007bff !important;
        border: none !important;
        font-weight: 700 !important;
        padding: 8px 20px !important;
        border-radius: 6px !important;
    }

    /* Table Styling (High Contrast) */
    .ajax-table-container { overflow-x:auto; margin-top:10px; }

    table.userTable { width:100%; border-collapse: collapse; min-width:800px; background: #ffffff; }

    table.userTable th { 
        background: #002244 !important; 
        color: #ffffff !important; 
        padding: 12px 15px !important;
        text-align: left;
        font-weight: 700 !important;
        border-bottom: 3px solid #00aaff !important;
        cursor: pointer;
    }

    table.userTable td { 
        border-bottom: 1px solid #eef2f7 !important; 
        padding: 12px 15px !important; 
        color: #000000 !important; /* Solid Black */
        font-weight: 600 !important; /* Sharp contrast */
    }

    table.userTable tr:nth-child(even) { background: #f8faff; }
    table.userTable tr:hover { background: #eef6ff; }
</style>

<script th:inline="javascript">
    function fetchData(event) {
        if(event) event.preventDefault();
        var xhr = new XMLHttpRequest();
        xhr.open("GET", [[@{/queryDatabase}]], true);
        xhr.onload = function () {
            if(xhr.status >= 200 && xhr.status < 300){
                document.getElementById('results').innerHTML = xhr.responseText;
                makeTableSortable('userTable');
            } else {
                document.getElementById('results').innerHTML = "<div class='alert alert-danger'>Error fetching data.</div>";
            }
        };
        xhr.send();
    }

    // Filter Logic
    function filterTable() {
        const input = document.getElementById("tableSearch");
        const filter = input.value.toLowerCase();
        const table = document.getElementById("userTable");
        if (!table) return;
        const rows = table.getElementsByTagName("tr");

        for (let i = 1; i < rows.length; i++) { // Skip header
            let visible = false;
            const cells = rows[i].getElementsByTagName("td");
            for (let j = 0; j < cells.length; j++) {
                if (cells[j].innerText.toLowerCase().indexOf(filter) > -1) {
                    visible = true;
                    break;
                }
            }
            rows[i].style.display = visible ? "" : "none";
        }
    }

    function makeTableSortable(tableId) {
        const table = document.getElementById(tableId);
        if(!table) return;
        const headers = table.querySelectorAll('th');
        headers.forEach((th,index)=>{
            th.onclick = function(){
                const tbody = table.querySelector('tbody');
                const rows = Array.from(tbody.querySelectorAll('tr'));
                rows.sort((a,b)=>{
                    const valA = a.children[index].innerText.toLowerCase();
                    const valB = b.children[index].innerText.toLowerCase();
                    return valA.localeCompare(valB);
                }).forEach(tr=>tbody.appendChild(tr));
            };
        });
    }

    window.addEventListener('DOMContentLoaded', fetchData);
</script>

</body>
</html>
