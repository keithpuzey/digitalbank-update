<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >

  <style>
    /* Sticky Home button (same as financial statement page) */
    .home-button {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 15px;
      background-color: #343A40;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      z-index: 1000;
    }

    .home-button:hover {
      background-color: #23272b;
      color: #fff;
    }

    body {
      padding-top: 70px; /* ensures content doesn't overlap the fixed button */
    }
  </style>
</head>
<body class="bg-light">

  <!-- Home Button -->
  <a href="/index.jsp" class="home-button">Home</a>

  <div class="container py-5">
    <h1 class="mb-4">User Profile</h1>

    <div class="row">
      <!-- User Info -->
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            User Information
          </div>
          <div class="card-body">
            <p><strong>ID:</strong> <span id="userId"></span></p>
            <p><strong>Name:</strong> <span id="userName"></span></p>
            <p><strong>Email:</strong> <span id="userEmail"></span></p>
            <p><strong>Phone:</strong> <span id="userPhone"></span></p>
            <p><strong>Role:</strong> <span id="userRole"></span></p>
          </div>
        </div>
      </div>

      <!-- Account Info -->
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm">
          <div class="card-header bg-success text-white">
            Account Information
          </div>
          <div class="card-body">
            <p><strong>Account ID:</strong> <span id="accountId"></span></p>
            <p><strong>Account Name:</strong> <span id="accountName"></span></p>
            <p><strong>Industry:</strong> <span id="accountIndustry"></span></p>
            <p><strong>Status:</strong> <span id="accountStatus"></span></p>
            <p><strong>Created At:</strong> <span id="accountCreated"></span></p>
            <p><strong>Country:</strong> <span id="accountCountry"></span></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- Profile Script -->
  <script src="sv-profile.js"></script>

</body>
</html>
