<table id="userTable" class="userTable">
    <thead>
        <tr>
            <th>SSN</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.ssn}"></td>
            <td th:text="${u.firstName}"></td>
            <td th:text="${u.lastName}"></td>
            <td th:text="${u.email}"></td>
        </tr>
    </tbody>
</table>
