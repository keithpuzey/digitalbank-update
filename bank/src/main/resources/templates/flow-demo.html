<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Diagram Editor</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    padding-top: 70px; /* space for sticky home button */
    background: #f0f4f8;
  }

  /* Sticky Home button */
  .home-button {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 10px 15px;
    background-color: #343A40;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    z-index: 1000;
  }

  h1 {
    text-align: center;
  }

  #diagram-container {
    border: 1px solid #ccc;
    background: #fff;
    width: 100%;
    height: 600px;
    position: relative;
    overflow: hidden;
    touch-action: none;
  }

  .controls {
    margin: 10px 0;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  button, input {
    padding: 6px 12px;
    font-size: 14px;
  }

  .node {
    fill: #4f46e5;
    stroke: #333;
    stroke-width: 1px;
    cursor: pointer;
  }

  .node-text {
    fill: #fff;
    font-size: 14px;
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .selected {
    stroke: #ff9900;
    stroke-width: 2px;
  }
</style>
</head>
<body>

<a href="/index.jsp" class="home-button">Home</a>

<h1>Demo Diagram Editor</h1>

<div class="controls">
  <input type="text" id="nodeLabel" placeholder="Node label">
  <button id="addNodeBtn">Add Node</button>
  <button id="connectBtn">Connect Nodes</button>
  <button id="deleteBtn">Delete Node</button>
</div>

<div id="diagram-container">
  <svg id="diagram" width="100%" height="100%">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
      </marker>
    </defs>
  </svg>
</div>

<script>
const svg = document.getElementById('diagram');
const container = document.getElementById('diagram-container');
const addNodeBtn = document.getElementById('addNodeBtn');
const nodeLabelInput = document.getElementById('nodeLabel');
const connectBtn = document.getElementById('connectBtn');
const deleteBtn = document.getElementById('deleteBtn');

let nodes = [];
let connections = [];
let selectedNode = null; // node selected for delete/connect
let draggingNode = null;  // node currently being dragged
let dragOffset = {x:0, y:0};

// Connect workflow
let connectMode = false;
let connectSourceNode = null;

// Utility: get event coordinates relative to container
function getEventCoords(e){
  const rect = container.getBoundingClientRect();
  if(e.touches) return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
  return { x: e.offsetX, y: e.offsetY };
}

// Node management
function createNode(x,y,label){
  const group = document.createElementNS("http://www.w3.org/2000/svg","g");
  group.setAttribute('transform', `translate(${x},${y})`);

  const rect = document.createElementNS("http://www.w3.org/2000/svg","rect");
  rect.setAttribute('width',120);
  rect.setAttribute('height',50);
  rect.setAttribute('rx',8);
  rect.setAttribute('ry',8);
  rect.classList.add('node');

  const text = document.createElementNS("http://www.w3.org/2000/svg","text");
  text.classList.add('node-text');
  text.setAttribute('x',60);
  text.setAttribute('y',25);
  text.textContent = label;

  group.appendChild(rect);
  group.appendChild(text);
  svg.appendChild(group);

  const nodeObj = {group, x, y, width:120, height:50, text};
  nodes.push(nodeObj);

  // Node events
  group.addEventListener('mousedown', e => {
    e.stopPropagation();
    handleNodeSelect(nodeObj, e);
  });
  group.addEventListener('touchstart', e => {
    e.preventDefault();
    handleNodeSelect(nodeObj, e);
  }, {passive:false});

  group.addEventListener('dblclick', e => {
    const newLabel = prompt('Enter new label', text.textContent);
    if(newLabel) text.textContent = newLabel;
  });

  return nodeObj;
}

// Select a node
function handleNodeSelect(nodeObj, e){
  if(connectMode){
    handleConnectClick(nodeObj);
    return;
  }

  // Select for delete/connect
  selectedNode = nodeObj;
  nodes.forEach(n => n.group.classList.remove('selected'));
  nodeObj.group.classList.add('selected');

  // Start dragging
  draggingNode = nodeObj;
  const coords = getEventCoords(e);
  dragOffset.x = coords.x - nodeObj.x;
  dragOffset.y = coords.y - nodeObj.y;
}

// Dragging nodes
container.addEventListener('mousemove', e => {
  if(draggingNode){
    const coords = getEventCoords(e);
    draggingNode.x = coords.x - dragOffset.x;
    draggingNode.y = coords.y - dragOffset.y;
    updatePositions();
  }
});
container.addEventListener('mouseup', e => draggingNode = null);

container.addEventListener('touchmove', e => {
  if(draggingNode){
    e.preventDefault();
    const coords = getEventCoords(e);
    draggingNode.x = coords.x - dragOffset.x;
    draggingNode.y = coords.y - dragOffset.y;
    updatePositions();
  }
}, {passive:false});
container.addEventListener('touchend', e => draggingNode = null);

// Update node positions and connections
function updatePositions(){
  nodes.forEach(n => n.group.setAttribute('transform', `translate(${n.x},${n.y})`));
  updateConnections();
}

// Connections
function createConnection(fromNode, toNode){
  const line = document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute('stroke','#333');
  line.setAttribute('stroke-width','2');
  line.setAttribute('marker-end','url(#arrow)');
  svg.insertBefore(line, svg.firstChild);
  connections.push({line, fromNode, toNode});
  updateConnections();
}

function updateConnections(){
  connections.forEach(c => {
    const fx = c.fromNode.x + c.fromNode.width/2;
    const fy = c.fromNode.y + c.fromNode.height/2;
    const tx = c.toNode.x + c.toNode.width/2;
    const ty = c.toNode.y + c.toNode.height/2;
    c.line.setAttribute('x1', fx);
    c.line.setAttribute('y1', fy);
    c.line.setAttribute('x2', tx);
    c.line.setAttribute('y2', ty);
  });
}

// Connect workflow
function handleConnectClick(node){
  if(!connectSourceNode){
    connectSourceNode = node;
    connectBtn.textContent = 'Click Target Node';
  } else if(node !== connectSourceNode){
    createConnection(connectSourceNode, node);
    connectSourceNode = null;
    connectMode = false;
    connectBtn.textContent = 'Connect Nodes';
  }
}

// Button actions
addNodeBtn.addEventListener('click', () => {
  const label = nodeLabelInput.value || `Node ${nodes.length+1}`;
  createNode(50 + nodes.length*20, 50 + nodes.length*20, label);
  nodeLabelInput.value = '';
});

connectBtn.addEventListener('click', () => {
  connectMode = true;
  connectSourceNode = null;
  connectBtn.textContent = 'Click Source Node';
});

deleteBtn.addEventListener('click', () => {
  if(!selectedNode){
    alert('Select a node to delete');
    return;
  }

  // Remove related connections
  connections = connections.filter(c => {
    if(c.fromNode === selectedNode || c.toNode === selectedNode){
      svg.removeChild(c.line);
      return false;
    }
    return true;
  });

  // Remove node
  svg.removeChild(selectedNode.group);
  nodes = nodes.filter(n => n !== selectedNode);
  selectedNode = null;
});

// Initialize with example nodes
createNode(50,50,"Start");
createNode(250,150,"Process");
createNode(450,50,"End");
</script>
</body>
</html>
