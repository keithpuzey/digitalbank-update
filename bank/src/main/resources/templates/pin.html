<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your PIN</title>
<link rel="stylesheet" href="styles.css">

<script>
if (!sessionStorage.getItem('loggedIn')) {
  if (window.location.pathname.indexOf('login-demo.html') === -1) {
    window.location.href = 'login-demo.html';
  }
}
</script>

</head>

<body>
<div class="app-shell">
<main class="phone">
<section class="screen">

<div class="top-status">
  <div>9:41</div>
  <div class="top-right">
    <div class="icon-dot"><span></span><span></span><span></span><span></span></div>
    <div class="icon-wifi"></div>
    <div class="icon-cell"></div>
  </div>
</div>

<div class="nav">
  <div class="nav-left">
    <button class="circle-btn" aria-label="Back" onclick="location.href='index.html'">&#8592;</button>
  </div>
  <button class="info-btn" aria-label="Information">i</button>
</div>

<div class="progress"><div style="width:24%"></div></div>
<div class="pin-lock"><span class="pin-hole"></span></div>

<h1 class="hero-title center">Create your PIN</h1>

<p class="subtext center" id="pinMessage">
  Choose a 6-digit PIN to secure your account on this device.
</p>

<div id="pinError"
     style="display:none;color:#d32f2f;text-align:center;margin-bottom:12px;font-weight:600;">
  PINs do not match. Please try again.
</div>

<div class="pin-dots" id="pinDots" data-testid="pin-dots">
  <span></span><span></span><span></span>
  <span></span><span></span><span></span>
</div>

<div class="keypad" data-testid="pin-keypad">
  <button class="key" data-number="1">1</button>
  <button class="key" data-number="2">2</button>
  <button class="key" data-number="3">3</button>

  <button class="key" data-number="4">4</button>
  <button class="key" data-number="5">5</button>
  <button class="key" data-number="6">6</button>

  <button class="key" data-number="7">7</button>
  <button class="key" data-number="8">8</button>
  <button class="key" data-number="9">9</button>

  <div></div>
  <button class="key" data-number="0">0</button>
  <div></div>
</div>

<script>
let firstPin = '';
let confirmPin = '';
let confirming = false;

const dots = [...document.querySelectorAll('#pinDots span')];
const message = document.getElementById('pinMessage');
const error = document.getElementById('pinError');

function clearDots() {
  dots.forEach(d => d.classList.remove('filled'));
}

function fillDots(count) {
  clearDots();
  for (let i = 0; i < count; i++) {
    dots[i].classList.add('filled');
  }
}

document.querySelectorAll('.key').forEach(btn => {
  btn.addEventListener('click', () => {

    error.style.display = 'none';

    if (!confirming) {

      if (firstPin.length >= 6) return;

      firstPin += btn.dataset.number;
      fillDots(firstPin.length);

      if (firstPin.length === 6) {
        setTimeout(() => {
          confirming = true;
          clearDots();
          message.textContent = 'Re-enter your 6-digit PIN to confirm.';
        }, 250);
      }

    } else {

      if (confirmPin.length >= 6) return;

      confirmPin += btn.dataset.number;
      fillDots(confirmPin.length);

      if (confirmPin.length === 6) {

        setTimeout(() => {

          if (firstPin === confirmPin) {
            sessionStorage.setItem('pinSet', firstPin);
            window.location.href = 'faceid.html';
          } else {

            error.style.display = 'block';

            firstPin = '';
            confirmPin = '';
            confirming = false;

            clearDots();
            message.textContent = 'Choose a 6-digit PIN to secure your account on this device.';
          }

        }, 250);
      }
    }
  });
});
</script>

</section>
</main>
</div>

</body>
</html>
