<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >

  <style>
    /* Sticky Home button */
    .home-button {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 15px;
      background-color: #343A40;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      z-index: 1000;
    }
    .home-button:hover {
      background-color: #212529;
    }

    body {
      padding-top: 70px; /* add space so content doesn’t hide under fixed button */
    }
  </style>
</head>

<body class="bg-light">

  <!-- Home Button -->
  <a href="/index.jsp" class="home-button">Home</a>

  <div class="container py-5">
    <h1 class="mb-4">User Directory Example using BlazeMeter SV SQL Query</h1>
    <h3 class="mb-4">Virtual Service = https://vs263031svc416110.mock.blazemeter.com/users</h3>

    <!-- Search Form -->
    <div class="input-group mb-3">
      <input 
        id="keywordInput" 
        type="text" 
        class="form-control" 
        placeholder="Search by keyword..."
      >
      <button id="searchBtn" class="btn btn-primary">Search</button>
    </div>

    <!-- Results Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Account ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <!-- Rows will be inserted dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- App Script -->
  <script src="sv-user-profile.js"></script>
</body>
</html>
