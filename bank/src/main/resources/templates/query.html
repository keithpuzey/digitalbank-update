<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Reports</title>
    <style>
        .userTable {
            border-collapse: collapse;
            width: 100%;
        }
        .userTable th, .userTable td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        .userTable th {
            background-color: #343A40;
            color: white;
        }
        h2 { margin-top: 30px; }
    </style>
    <script>
		function fetchData(event, type) {
		    event.preventDefault();
		    var xhr = new XMLHttpRequest();
		    // include /bank context
		    xhr.open("GET", "/bank/userReport?type=" + type, true);
		    xhr.onload = function () {
		        if (xhr.status >= 200 && xhr.status < 300) {
		            document.getElementById('results').innerHTML = xhr.responseText;
		        } else {
		            document.getElementById('results').innerHTML = "Error fetching data.";
		        }
		    };
		    xhr.onerror = function () {
		        document.getElementById('results').innerHTML = "Network error.";
		    };
		    xhr.send();
		}
    </script>
</head>
<body>
    <h1>User Reports</h1>

    <div class="button-container">
        <form onsubmit="fetchData(event, 'registered')">
            <input type="submit" value="Registered Users" class="report-btn">
        </form>

        <form onsubmit="fetchData(event, 'common')">
            <input type="submit" value="Credit Card Registered Users" class="report-btn">
        </form>

        <form onsubmit="fetchData(event, 'inconsistent')">
            <input type="submit" value="Inconsistent Users" class="report-btn">
        </form>
    </div>

    <div id="results" style="margin-top: 30px;"></div>

    <a href="/index.jsp" class="home-btn">Home</a>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f9f9f9;
        }

        h1 {
            margin-bottom: 30px;
            color: #343A40;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px; /* spacing between buttons */
            max-width: 300px;
        }

        .report-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .report-btn:hover {
            background-color: #0056b3;
        }

        .home-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background-color: #343A40;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }

        .home-btn:hover {
            background-color: #1d2124;
        }
    </style>
</body>
</html>
